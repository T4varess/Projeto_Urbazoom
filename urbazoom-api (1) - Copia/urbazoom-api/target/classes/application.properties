spring.application.name=urbazoom-api

# Banco H2 em memoria (os dados voltam ao estado inicial a cada execucao)
spring.datasource.url=jdbc:h2:mem:urbazoom;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria as tabelas a partir das entidades; depois o data.sql carrega os dados
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# Console do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true

spring.jackson.serialization.write-dates-as-timestamps=false
